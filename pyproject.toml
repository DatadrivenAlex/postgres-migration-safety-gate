[project]
name = "postgres-migration-safety-gate"
version = "0.1.0"
description = "Offline static risk checks for PostgreSQL schema migrations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlglot>=26,<29"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
migration-guard = "migration_guard.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv]
package = true
